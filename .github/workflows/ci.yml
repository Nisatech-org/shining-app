name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # This workflow also runs in the public app repo (no server/) and the backend repo (no app/).
      - name: Build the app and run the app's unit tests
        if: hashFiles('app/build.gradle.kts') != ''
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Run the server's tests (unit, fake Samad, end to end)
        if: always() && hashFiles('server/build.gradle.kts') != ''
        run: ./gradlew --no-daemon :server:test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            server/build/reports/tests/

      - name: Upload debug APK
        if: hashFiles('app/build.gradle.kts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: shining-debug
          path: app/build/outputs/apk/debug/*.apk
