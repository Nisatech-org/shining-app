name: Release

# Pushing a tag like v1.12.0 builds the signed release APK and publishes it as a GitHub Release,
# created by github-actions[bot]. The tag must match versionName in app/build.gradle.kts.
#
# The release notes: in a public repo, the body of the tagged commit's message (everything after
# the first line); in a private repo, GitHub's notes generated from the commits and pull requests
# since the previous release.
#
# Running the workflow by hand (Actions > Release > Run workflow) builds the same signed APK and
# keeps it as a run artifact without publishing anything, to check the build and the secrets.
#
# Needs these repository secrets:
#   RELEASE_KEYSTORE_BASE64   the release .jks, base64-encoded
#   RELEASE_STORE_PASSWORD    the keystore password
#   RELEASE_KEY_ALIAS         the key alias
#   RELEASE_KEY_PASSWORD      the key password
#   GOOGLE_SERVICES_JSON      app/google-services.json, so the release gets menu alerts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Only the Nisatech-org repos hold the signing secrets; copies anywhere else skip this.
    if: github.repository_owner == 'Nisatech-org'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the app version
        id: version
        run: |
          name=$(sed -nE 's/^ *versionName *= *"([^"]+)".*/\1/p' app/build.gradle.kts)
          code=$(sed -nE 's/^ *versionCode *= *([0-9]+).*/\1/p' app/build.gradle.kts)
          [ -n "$name" ] && [ -n "$code" ] || { echo "::error::Couldn't read versionName and versionCode from app/build.gradle.kts"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version $name ($code)"

      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG doesn't match versionName $VERSION. Tag the commit as v$VERSION, or bump versionName."
            exit 1
          fi

      - name: Write the signing key and Firebase config
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD GOOGLE_SERVICES_JSON; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing release secrets:$missing (see the top of .github/workflows/release.yml)"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # app/build.gradle.kts reads keystore.properties from the repo root.
          {
            echo "storeFile=$keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build the release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Check the APK is signed with the release key
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "::error::No signed APK at $apk (an unsigned build is named app-release-unsigned.apk)"; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          # verify exits non-zero if the signature is broken. Its wording varies by version
          # ("Signer #1 certificate DN" or "Signer (minSdkVersion=...) certificate DN"), so match loosely.
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          grep -E 'certificate (DN|SHA-256 digest)' "$RUNNER_TEMP/certs.txt" || cat "$RUNNER_TEMP/certs.txt"
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The APK is signed with the debug key, not the release key"
            exit 1
          fi
          out="shining-$VERSION.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Remove the signing key and Firebase config
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties app/google-services.json

      - name: Keep the APK as a run artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: shining-${{ steps.version.outputs.name }}-release
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
          APK: ${{ steps.apk.outputs.file }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$PRIVATE" = true ]; then
            notes=(--generate-notes)
          else
            # The notes are the body of the tagged commit's message (everything after the first line).
            git log -1 --format=%b "$GITHUB_SHA" > notes.md
            [ -s notes.md ] || echo "Shining $VERSION" > notes.md
            notes=(--notes-file notes.md)
          fi
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --title "Shining $VERSION" \
            "${notes[@]}" \
            --verify-tag
