name: Bug report (گزارش باگ)
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Persian or English is fine. Please search the [existing issues](https://github.com/Nisatech-org/shining-app/issues) first.
        Never paste your password, a forget code or a card number here.
  - type: textarea
    id: what
    attributes:
      label: What happened? (چه اتفاقی افتاد؟)
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (مراحل تکرار)
      placeholder: |
        1. Open Reserve
        2. Pick Saturday
        3. Tap «رزرو» on a food
        4. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Part of the app (بخش برنامه)
      options:
        - Home (خانه)
        - Reserve (رزرو)
        - Daily sale (روز فروش)
        - Market (بازار)
        - Profile or accounts (پروفایل و حساب‌ها)
        - Login or guest login (ورود)
        - Menu alerts and reminders (اعلان‌ها)
        - Settings (تنظیمات)
        - Something else (بخش دیگر)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version (نسخه‌ی برنامه)
      description: Shown in Settings.
      placeholder: "1.16.0"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Installed from (از کجا نصب کردید)
      options:
        - Cafe Bazaar (کافه‌بازار)
        - GitHub Releases
        - Built it myself (خودم ساختم)
  - type: input
    id: device
    attributes:
      label: Phone and Android version (گوشی و نسخه‌ی اندروید)
      placeholder: Samsung A54, Android 14
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a screen recording (اسکرین‌شات یا فیلم)
      description: Drag files here. Please cover your name, student number, codes and card numbers first.
