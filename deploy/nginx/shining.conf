# The Shining menu server's public API. __DOMAIN__ is filled in by deploy/server-setup.sh
# (shining-api.nisatech.org). DNS on Cloudflare with its proxy off (DNS only), so
# phones come straight here. HTTPS with this site's own Let's Encrypt certificate (certbot, webroot
# /var/www/letsencrypt); port 80 only answers the ACME challenge and redirects everything else.

# The app asks for the status when Home opens and every ~30 minutes in the background. Many phones
# on Iranian mobile networks share one address (carrier NAT), so the limit is generous.
limit_req_zone $binary_remote_addr zone=shining_api:2m rate=60r/m;

# Plain HTTP: the ACME challenge for certbot, a redirect to HTTPS for everything else.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    include /etc/nginx/snippets/tls-__DOMAIN__.conf;
    server_name __DOMAIN__;

    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json;

    # proxy_set_header must stay at this level: a location with any of its own drops all of these.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # Only the API is public; everything else doesn't exist.
    location = /v1/status {
        limit_req zone=shining_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8060;
    }

    location = /v1/debug {
        limit_req zone=shining_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8060;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8060;
    }

    location / {
        return 404;
    }
}
